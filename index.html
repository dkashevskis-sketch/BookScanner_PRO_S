<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BookScanner PRO</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📚 BookScanner PRO</h1>

<p class="subtitle">
Сканируй книгу прямо с телефона
</p>

<div class="card">

<h2>📷 Добавить страницу</h2>

<label class="upload camera">

📷 Сделать фото

<input
type="file"
id="cameraInput"
accept="image/*"
capture="environment"
hidden>

</label>

<label class="upload gallery">

🖼 Выбрать фото

<input
type="file"
id="galleryInput"
accept="image/*"
hidden>

</label>

<img id="preview">

<label>

Номер страницы

</label>

<input
type="number"
id="pageNumber"
value="1"
min="1">

<button id="scanButton">

🤖 Сканировать страницу

</button>

<p id="status">

Готов

</p>

</div>

<div class="card">

<h2>📚 Страницы книги</h2>

<div id="pagesList">

Пока нет страниц

</div>

<button
id="resetBook"
class="danger">

🗑 Сброс книги

</button>

</div>

<div class="card">

<h2>📄 Получить текст</h2>

<label>

От страницы

</label>

<input
type="number"
id="fromPage">

<label>

До страницы

</label>

<input
type="number"
id="toPage">

<button id="showText">

📖 Собрать книгу

</button>

<button id="downloadText">

⬇ Скачать TXT

</button>

<textarea
id="output"
readonly>

</textarea>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
